# DroidCam carga snd-aloop (/etc/modules-load.d/droidcam.conf) como tarjeta ALSA 0.
# WirePlumber la prioriza por encima del audio real (sof-hda-dsp) y el sonido
# acaba yendo al dispositivo Loopback (silencio). Bajar prioridad evita eso.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "Loopback" }
      { alsa.driver_name = "snd_aloop" }
    ]
    actions = {
      update-props = {
        priority.session = 1
        priority.driver = 1
        device.description = "Loopback (DroidCam — no usar como salida)"
      }
    }
  }
]
