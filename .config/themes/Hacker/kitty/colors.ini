cursor_shape          Underline
cursor_underline_thickness 1
window_padding_width  20

# Special — Hacker / Matrix (negro + verde neón)
foreground #a6e3a1
background #0c0c0c

# Black
color0 #141414
color8 #2e3d2e

# Red (error / alerta, desaturado para no romper el look)
color1 #6b2a2a
color9 #a63d3d

# Green — núcleo matrix
color2  #3d9a45
color10 #a6e3a1

# Yellow → lima (mapa / highlights)
color3  #7dce4a
color11 #b8f06a

# Blue → verde medio (labels del fetch / prompt)
color4  #4caf50
color12 #81c784

# Magenta → verde grisáceo (usuario en prompt)
color5  #6a9a6e
color13 #a6e3a1

# Cyan → neón (info / acentos)
color6  #39c96b
color14 #5cff9a

# White
color7  #b8d4b8
color15 #e8f5e9

# Cursor
cursor #5cff9a
cursor_text_color #0c0c0c

# Selection highlight
selection_foreground #0c0c0c
selection_background #a6e3a1

# Tabs
active_tab_foreground   #0c0c0c
active_tab_background   #a6e3a1
inactive_tab_foreground #6a9a6e
inactive_tab_background #141414
url_color #5cff9a
