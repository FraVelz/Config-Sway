[preferred]
# Fallback genérico (XDG_CURRENT_DESKTOP puede ser "sway" o "sway:wlroots").
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# Sway no implementa SessionManager/ScreenSaver de GTK; evita inhibidor roto en Firefox, etc.
org.freedesktop.impl.portal.Inhibit=none
