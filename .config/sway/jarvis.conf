# Jarvis Mini HUD — Alt+Space
# Ruta absoluta: el PATH de Sway no incluye ~/.local/bin.

bindsym Alt+space exec /home/fravelz/.local/bin/jarvis mini-toggle

for_window [app_id="fravelz-jarvis-mini"] floating enable, sticky enable, border pixel 0
for_window [class="fravelz-jarvis-mini"] floating enable, sticky enable, border pixel 0
for_window [title="^Jarvis Mini"] floating enable, sticky enable, border pixel 0
