# Teclado / idiomas (fcitx5 + rofi)
# Atajo: Alt+Shift+S  —  no usar Super (Super+Shift+S es workspace magic).
# Mapa: última opción del menú (paquete tecla). No cambia el IM.

bindsym --no-repeat Mod1+Shift+s exec ~/.config/scripts/teclado-rofi.sh

# Visor de layout: flotante, sticky, sin barra de título.
for_window [app_id="org.gnome.Tecla"] floating enable, sticky enable, move position center, border pixel 2

exec_always ~/.config/scripts/teclado-session-env.sh
